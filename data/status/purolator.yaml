# yaml-language-server: $schema=../../schema/status.schema.json
#
# Purolator event codes (`events[].code`). A package or shipment `status.code` of DEL means
# delivered, whatever the newest event says.
carrier: purolator
entries:
  - { match: { code: DEL }, status: delivered }
  - { match: { code: "3000" }, status: registered, note: "The shipper created a label." }
  - { match: { code: "3010" }, status: registered }
  - { match: { code: "0300" }, status: in_transit }
  - { match: { code: "0500" }, status: in_transit, note: "Delayed: missed connection." }
  - { match: { code: "0510" }, status: in_transit, note: "Delayed: rail delay." }
  - { match: { code: "1300" }, status: in_transit }
  - { match: { code: "2300" }, status: in_transit }
  - { match: { code: "2380" }, status: in_transit }
  - { match: { code: "4060" }, status: in_transit }
  - { match: { code: "4100" }, status: in_transit }
  - { match: { code: "6720" }, status: in_transit, note: "Scheduled for the next business day." }
  - { match: { code: "7220" }, status: in_transit }
  - { match: { code: "7520" }, status: in_transit }
  - { match: { code: "7525" }, status: in_transit }
  - { match: { code: "7810" }, status: in_transit }
  - { match: { code: "4200" }, status: out_for_delivery }
  - { match: { code: "6500" }, status: problem, note: "Address correction in progress." }
  - { match: { code: "9230" }, status: problem, note: "Address correction: missing entry code." }
  - { match: { code: "9260" }, status: problem }
  - { match: { code: "9550" }, status: at_pickup_point, pickup: true }
  - { match: { code: "9000" }, status: delivered }
  - { match: { code: "9500" }, status: delivered }
tests:
  - { input: { code: "4200" }, status: out_for_delivery }
  - { input: { code: "9550" }, status: at_pickup_point, pickup: true }
  - { input: { code: DEL }, status: delivered }
  - { input: { code: "1234" }, status: null }
