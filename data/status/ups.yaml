# yaml-language-server: $schema=../../schema/status.schema.json
#
# UPS has three vocabularies that share no meaning, so every code carries its vocabulary:
# `milestone:` (the public tracking's locale-independent `nameKey`), `scan:` (scan activity
# codes, `actCode`, learned from the scan sentences UPS pairs with each, not from the developer
# status-code list, which shares the two-letter shape) and `type:` (the official API's activity
# status type). Address changes the user asked for are routine in_transit. Scan codes UPS only
# emits around an exception stay a problem even when the sentence reports the resolution.
# `unknown` marks scans known and deliberately unmapped (an intention, a request, a renumbering).
carrier: ups
entries:
  - { match: { code: "milestone:cms.stapp.orderReceived" }, status: registered }
