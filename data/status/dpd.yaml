  - { input: { code: "DEHDY" }, status: in_transit, pickup: true }
  - { input: { code: "DOMSDLO" }, status: in_transit, pickup: true }
  - { input: { code: "DEY" }, status: delivered }
  - { input: { code: "DEYY" }, status: delivered }
