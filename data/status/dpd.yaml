  - { input: { code: "step:PICKUP" }, status: at_pickup_point, pickup: true }
  - { input: { code: "icon:6" }, status: delivered }
  - { input: { code: "icon:3" }, status: null }
  - { input: { code: PARCEL_OUT_FOR_DELIVERY }, status: out_for_delivery }
  - { input: { code: UNSUCCESSFUL_DELIVERY_ATTEMPT }, status: problem }
  - { input: { code: DODEI }, status: at_pickup_point, pickup: true }
  - { input: { code: DODEY }, status: delivered, pickup: true }
  - { input: { code: DOPKY }, status: in_transit }
  - { input: { code: "parcelStatusType:5" }, status: at_pickup_point, pickup: true }
