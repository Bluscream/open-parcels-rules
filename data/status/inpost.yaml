# yaml-language-server: $schema=../../schema/status.schema.json
#
# InPost. Four vocabularies, written in lower case: "inbox:" (the Polish account inbox),
# "inbox-group:" (its coarse status group), "group:" (the Italian inbox) and "tracking:" (the public
# cross-border tracking codes). Taken by courier means collected from the sender, far from delivered;
# `avizo` is a bare notice after the receiver turned the parcel away, not a "ready" state.
carrier: inpost
entries:
  # The Polish account inbox: detailed `status`, also used by its event log entries' `name`.
  - { match: { code: "inbox:created" }, status: registered }
  - { match: { code: "inbox:confirmed" }, status: registered }
  - { match: { code: "inbox:dispatched_by_sender" }, status: registered }
  - { match: { code: "inbox:dispatched_by_sender_to_pok" }, status: registered }
  - { match: { code: "inbox:taken_by_courier" }, status: in_transit }
  - { match: { code: "inbox:taken_by_courier_from_pok" }, status: in_transit }
  - { match: { code: "inbox:collected_from_sender" }, status: in_transit }
  - { match: { code: "inbox:adopted_at_source_branch" }, status: in_transit }
  - { match: { code: "inbox:sent_from_source_branch" }, status: in_transit }
  - { match: { code: "inbox:adopted_at_sorting_center" }, status: in_transit }
  - { match: { code: "inbox:sent_from_sorting_center" }, status: in_transit }
  - { match: { code: "inbox:adopted_at_target_branch" }, status: in_transit }
  - { match: { code: "inbox:redirect_to_box" }, status: in_transit }
  - { match: { code: "inbox:permanently_redirected_to_box_machine" }, status: in_transit }
  - {
      match: { code: "inbox:permanently_redirected_to_customer_service_point" },
      status: in_transit,
    }
  - { match: { code: "inbox:readdressed" }, status: in_transit }
  - { match: { code: "inbox:out_for_delivery" }, status: out_for_delivery }
  - { match: { code: "inbox:out_for_delivery_to_address" }, status: out_for_delivery }
  - { match: { code: "inbox:ready_to_pickup" }, status: at_pickup_point, pickup: true }
  - { match: { code: "inbox:ready_for_collection" }, status: at_pickup_point, pickup: true }
  - { match: { code: "inbox:ready_to_pickup_from_branch" }, status: at_pickup_point, pickup: true }
  - { match: { code: "inbox:ready_to_pickup_from_pok" }, status: at_pickup_point, pickup: true }
  - {
      match: { code: "inbox:ready_to_pickup_from_pok_registered" },
      status: at_pickup_point,
      pickup: true,
    }
  - { match: { code: "inbox:stack_in_box_machine" }, status: at_pickup_point, pickup: true }
  - {
      match: { code: "inbox:stack_in_customer_service_point" },
      status: at_pickup_point,
      pickup: true,
    }
  - { match: { code: "inbox:pickup_reminder_sent" }, status: at_pickup_point, pickup: true }
  - { match: { code: "inbox:pickup_reminder_sent_address" }, status: at_pickup_point, pickup: true }
  - {
      match: { code: "inbox:stack_parcel_in_box_machine_pickup_time_expired" },
      status: at_pickup_point,
      pickup: true,
    }
  - { match: { code: "inbox:delivered" }, status: delivered }
  - { match: { code: "inbox:collected_by_customer" }, status: delivered }
  - { match: { code: "inbox:claimed" }, status: delivered }
  - { match: { code: "inbox:returned_to_sender" }, status: returning }
  - { match: { code: "inbox:return_pickup_confirmation_to_sender" }, status: returning }
  - { match: { code: "inbox:delay_in_delivery" }, status: problem }
  - { match: { code: "inbox:delivery_attempt_failed" }, status: problem }
  - { match: { code: "inbox:rejected_by_receiver" }, status: problem }
  - { match: { code: "inbox:not_collected" }, status: problem }
  - { match: { code: "inbox:missing" }, status: problem }
  - { match: { code: "inbox:oversized" }, status: problem }
  - { match: { code: "inbox:canceled" }, status: problem }
  - { match: { code: "inbox:cancelled" }, status: problem }
  - { match: { code: "inbox:pickup_time_expired" }, status: problem }
  - { match: { code: "inbox:stack_parcel_pickup_time_expired" }, status: problem }
  - { match: { code: "inbox:avizo" }, status: problem }
  - { match: { code: "inbox:avizo_rejected" }, status: problem }
  - { match: { code: "inbox:undelivered" }, status: problem }
  - { match: { code: "inbox:undelivered_cod_cash_receiver" }, status: problem }
  - { match: { code: "inbox:undelivered_incomplete_address" }, status: problem }
  - { match: { code: "inbox:undelivered_lack_of_access_letterbox" }, status: problem }
  - { match: { code: "inbox:undelivered_no_mailbox" }, status: problem }
  - { match: { code: "inbox:undelivered_not_live_address" }, status: problem }
  - { match: { code: "inbox:undelivered_unknown_receiver" }, status: problem }
  - { match: { code: "inbox:undelivered_wrong_address" }, status: problem }
  # Cash-on-delivery payment events say nothing about where the parcel is.
  - { match: { code: "inbox:cod_completed" }, status: unknown }
  - { match: { code: "inbox:c2x_completed" }, status: unknown }
  # The Polish inbox's coarse `statusGroup`, used when the detailed status is unknown.
  - { match: { code: "inbox-group:to_send" }, status: registered }
  - { match: { code: "inbox-group:in_delivery" }, status: in_transit }
  - { match: { code: "inbox-group:to_pickup" }, status: at_pickup_point, pickup: true }
  - { match: { code: "inbox-group:delivered" }, status: delivered }
  # The Italian inbox's event status catalogue.
  - { match: { code: "group:at_the_origin" }, status: registered }
  - { match: { code: "group:in_transit" }, status: in_transit }
  - { match: { code: "group:in_transit_last_mile" }, status: out_for_delivery }
  - { match: { code: "group:awaiting_collection" }, status: at_pickup_point, pickup: true }
  - { match: { code: "group:delivered" }, status: delivered }
  - { match: { code: "group:not_delivered" }, status: problem }
  - { match: { code: "group:exception" }, status: problem }
  - { match: { code: "group:return" }, status: returning }
  # The public cross-border tracking codes.
  - { match: { code: "tracking:cre.1001" }, status: registered }
  - { match: { code: "tracking:fmd.1001" }, status: registered }
  - { match: { code: "tracking:fmd.1002" }, status: in_transit }
  - { match: { code: "tracking:mmd.1001" }, status: in_transit }
  - { match: { code: "tracking:mmd.1002" }, status: in_transit }
  - { match: { code: "tracking:mmd.1003" }, status: in_transit }
  - { match: { code: "tracking:mmd.1004" }, status: in_transit }
  - { match: { code: "tracking:lmd.1001" }, status: in_transit }
  - { match: { code: "tracking:lmd.1002" }, status: in_transit }
  - { match: { code: "tracking:lmd.3006" }, status: in_transit }
  - { match: { code: "tracking:lmd.3014" }, status: in_transit }
  - { match: { code: "tracking:lmd.1004" }, status: at_pickup_point, pickup: true }
  - { match: { code: "tracking:lmd.1005" }, status: at_pickup_point, pickup: true }
  - { match: { code: "tracking:lmd.9001" }, status: at_pickup_point, pickup: true }
  - { match: { code: "tracking:lmd.9002" }, status: problem }
  - { match: { code: "tracking:lmd.9014" }, status: returning }
  - { match: { code: "tracking:eol.1001" }, status: delivered }
  - { match: { code: "tracking:eol.1003" }, status: delivered }
  - { match: { code: "tracking:eol.9001" }, status: problem }
  - { match: { code: "tracking:rts.1001" }, status: returning }
  - { match: { code: "tracking:rts.1002" }, status: returning }
tests:
  - { input: { code: "inbox:taken_by_courier" }, status: in_transit }
  - {
      input: { code: "inbox:stack_parcel_in_box_machine_pickup_time_expired" },
      status: at_pickup_point,
      pickup: true,
    }
  - { input: { code: "inbox:cod_completed" }, status: unknown }
  - { input: { code: "inbox-group:to_pickup" }, status: at_pickup_point }
  - { input: { code: "group:in_transit_last_mile" }, status: out_for_delivery }
  - { input: { code: "tracking:eol.1001" }, status: delivered }
  - { input: { code: "inbox:teleported" }, status: null }
