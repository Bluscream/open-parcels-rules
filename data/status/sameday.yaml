# yaml-language-server: $schema=../../schema/status.schema.json
#
# Sameday: the numeric `statusStateId` of an AWB event. Returns, cancellations and failures map to
# the nearest canonical value; postponements and redirects are still in transit.
carrier: sameday
entries:
  - { match: { code: "1" }, status: registered }
  - { match: { code: "2" }, status: in_transit }
  - { match: { code: "3" }, status: in_transit }
  - { match: { code: "4" }, status: out_for_delivery }
  - { match: { code: "5" }, status: delivered }
  - { match: { code: "6" }, status: problem }
  - { match: { code: "7" }, status: in_transit }
  - { match: { code: "8" }, status: returning }
  - { match: { code: "9" }, status: in_transit }
  - { match: { code: "10" }, status: problem }
  - { match: { code: "11" }, status: problem }
  - { match: { code: "12" }, status: in_transit }
  - { match: { code: "13" }, status: returning }
  - { match: { code: "14" }, status: returning }
  - { match: { code: "15" }, status: returning }
  - { match: { code: "16" }, status: problem }
  - { match: { code: "17" }, status: in_transit }
  - { match: { code: "18" }, status: at_pickup_point, pickup: true }
  - { match: { code: "19" }, status: in_transit }
  - { match: { code: "20" }, status: at_pickup_point, pickup: true }
  - { match: { code: "21" }, status: in_transit }
  - { match: { code: "22" }, status: problem }
  - { match: { code: "23" }, status: problem }
  - { match: { code: "24" }, status: in_transit }
  - { match: { code: "25" }, status: in_transit }
  - { match: { code: "26" }, status: in_transit }
  - { match: { code: "27" }, status: in_transit }
  - { match: { code: "29" }, status: problem }
  - { match: { code: "30" }, status: problem }
tests:
  - { input: { code: "1" }, status: registered }
  - { input: { code: "18" }, status: at_pickup_point, pickup: true }
  - { input: { code: "13" }, status: returning }
  - { input: { code: "28" }, status: null }
