# yaml-language-server: $schema=../../schema/status.schema.json
#
# bpost process steps (`activeStep.knownProcessStep`). The same vocabulary also appears,
# case-flattened, as `activeStep.name` (codes compare ignoring case); "name:<name>" lists the
# names that are not step codes. "prefix:<p>" maps every leading `_`-segment prefix of a known
# name (lower case, first family wins) for names bpost has not shown yet: the consumer tries the
# longest prefix first. Prefix matches are guesses.
