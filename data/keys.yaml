# yaml-language-server: $schema=../schema/keys.schema.json
#
# Fixed public values carriers expect from every client: keys their own website or app sends,
# public app client ids, app versions and the User-Agents a carrier insists on. None of them
# identifies a user; a user's credentials never belong here.
#
# `last_verified` is the date the value was last seen working. The first entries were moved here
# from the open-parcels plug-ins, which recorded them on 2026-11-18.
keys:
  - carrier: amazon
    name: app_version
    purpose: "`app_version` of the Alexa iOS app sent with device registration and token refresh."
    source: app
    last_verified: 2026-11-18
    value: "2.2.556530.0"
  - carrier: amazon
    name: device_type
    purpose: Device type of the Alexa iOS app; identifies the client during device registration.
    source: app
    last_verified: 2026-11-18
    value: A2IVLV5VM2W81
  - carrier: amazon
    name: device_id_suffix
