# yaml-language-server: $schema=../../schema/mail-rule.schema.json
id: parcel-ebay
name: eBay shipping notifications
kind: parcel
senders:
  domains: [ebay.com, ebay.de, ebay.co.uk, ebay.ca, ebay.it, ebay.com.au, ebay.pl, ebay.fr, ebay.at]
  local_parts: [ebay, member, notification]
subject:
  - "shipped|versandt|verschickt|dispatched|tracking|on its way|unterwegs|delivered|zugestellt|angekommen"
carrier_from: carrier
extractors: [detect_tracking_numbers]
extract:
  carrier:
    - pattern: '(?:versand mit|versandservice|versanddienstleister|carrier|shipped with|shipping service|via)\s*:?\s*(?<carrier>DHL|Deutsche Post|Hermes|DPD|GLS|UPS|FedEx|Royal Mail|USPS|Evri|Canada Post|Australia Post)\b'
  order_number:
    - pattern: '\b(?<order_number>\d{2}-\d{5}-\d{5})\b'
  item:
    - pattern: '(?:artikel|item):\s*(?<item>[^\n]{3,80})'
      in: [text]
status_keywords:
  - status: delivered
    patterns: ["delivered|zugestellt|angekommen"]
    in: [subject]
default_status: in_transit
tests:
  - fixture: ebay-de-shipped.eml
    expect:
      - ruleId: parcel-ebay
        kind: parcel
        carrier: hermes
        trackingNumbers: ["41000111222336"]
        orderNumbers: ["12-34567-89012"]
        status: in_transit
        items: ["Retro-Kofferradio, gebraucht"]
  - fixture: ebay-com-delivered.eml
    expect:
      - ruleId: parcel-ebay
        carrier: usps
        trackingNumbers: ["9400111200000001234565"]
        orderNumbers: ["21-12345-67890"]
        status: delivered
