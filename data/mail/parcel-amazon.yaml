# yaml-language-server: $schema=../../schema/mail-rule.schema.json
id: parcel-amazon
name: Amazon shipping and delivery notifications
kind: parcel
senders:
  domains:
    [
      amazon.de,
      amazon.com,
      amazon.co.uk,
      amazon.it,
      amazon.pl,
      amazon.fr,
      amazon.es,
      amazon.nl,
      amazon.ca,
      amazon.com.au,
      amazon.in,
    ]
  local_parts:
    [
      shipment-tracking,
      order-update,
      conferma-spedizione,
      delivering,
      thehub,
      versandbestaetigung,
      dispatch-confirmation,
    ]
exclude:
  - "^(?:your )?(?:return|refund|rücksendung|rückgabe|erstattung|zwrot)"
  - "zahlungserinnerung|mahnung"
carrier: amazon
carrier_from: carrier
extractors: [detect_tracking_numbers]
extract:
  order_number:
    - pattern: '(?<order_number>\b\d{3}-\d{7}-\d{7}\b)'
  carrier:
    - pattern: '(?:delivery by|delivered by|zustellung durch|versand durch|versendet mit|carrier):?\s*(?<carrier>[A-Za-z][A-Za-z .-]{1,30}?)\s*(?:\n|$|[.,(])'
      in: [text]
  pickup_code:
    - pattern: 'package to pick up\D{0,40}(?<pickup_code>\d{6})'
      in: [subject]
    - pattern: '(?:pickup code is|abholcode(?: lautet)?:?|one-time password is|einmalpasswort lautet)\s*(?<pickup_code>\d{6})'
      in: [text]
  arrival:
    - pattern: '(?<arrival>(?:now arriving|arriving|zustellung|ankunft|arriverà|dostawa)[^\n]{0,60})'
      in: [subject, text]
  item:
    - pattern: '^\s*[•*]\s*(?<item>[^\n]{3,80})$'
      flags: [i, m]
      in: [text]
  tracking_url:
    - pattern: '(?<tracking_url>https://www\.amazon\.[a-z.]+/(?:gp/your-account/ship-track|progress-tracker/package|gp/css/shiptrack)[^\s"<>]*)'
      in: [text, html]
status_keywords:
  - status: at_pickup_point
    patterns: ["package to pick up|zur abholung bereit|abholbereit|ready for pickup"]
  - status: delivered
    patterns: ["^(?:delivered|zugestellt|geliefert|dostarczono|consegna effettuata)"]
    in: [subject]
  - status: problem
    patterns: ["running late|verspätet sich|delivery attempt|zustellversuch|could not be delivered"]
  - status: out_for_delivery
    patterns: ["out for delivery|wird heute zugestellt|zustellung heute|in zustellung"]
default_status: in_transit
tests:
  - fixture: amazon-de-shipped.eml
    time_zone: Europe/Berlin
    expect:
      # Results come in rule-id order: the order rule reads the same mail.
      - ruleId: order-amazon
        kind: order
        event: order_shipped
        orderNumbers: ["302-1234567-1234567"]
      - ruleId: parcel-amazon
        kind: parcel
        carrier: dhl
        trackingNumbers: ["00340434123456789012"]
        orderNumbers: ["302-1234567-1234567"]
        status: in_transit
        items: ["Beispielartikel, schwarz", "Ersatzkabel 2 m"]
        arrival:
          { from: "2026-11-20T00:00:00+01:00", to: "2026-11-21T00:00:00+01:00", allDay: true }
        trackingUrl: "https://www.amazon.de/gp/your-account/ship-track?orderId=302-1234567-1234567&shipmentId=Dx0Ex0Ax0Mx0P"
  - fixture: amazon-com-delivered.eml
    time_zone: America/New_York
    expect:
      - ruleId: parcel-amazon
        carrier: amazon
        trackingNumbers: ["TBA301234567890"]
        orderNumbers: ["112-7654321-7654321"]
        status: delivered
  - fixture: amazon-locker.eml
    expect:
      - ruleId: parcel-amazon
        status: at_pickup_point
        pickupCode: "246810"
        orderNumbers: ["114-1111111-2222222"]
  - fixture: amazon-uk-late.eml
    time_zone: Europe/London
    expect:
      - ruleId: parcel-amazon
        status: problem
        orderNumbers: ["203-3333333-4444444"]
        arrival:
          { from: "2026-11-21T00:00:00+00:00", to: "2026-11-22T00:00:00+00:00", allDay: true }
  - fixture: amazon-de-today-window.eml
    time_zone: Europe/Berlin
    expect:
      - ruleId: parcel-amazon
        carrier: amazon
        trackingNumbers: ["DE2001234567"]
        status: out_for_delivery
        arrival:
          { from: "2026-11-18T17:00:00+01:00", to: "2026-11-18T19:00:00+01:00", allDay: false }
