# yaml-language-server: $schema=../../schema/mail-rule.schema.json
id: parcel-hermes
name: Hermes Germany and Evri parcel notifications
kind: parcel
senders:
  addresses: [donotreply@myhermes.co.uk]
  domains: [myhermes.de, hermesworld.com, evri.com]
carrier: hermes
extractors: [detect_tracking_numbers]
extract:
  tracking_number:
    - pattern: '\b(?<tracking_number>H\d{19})\b'
  tracking_url:
    - pattern: '(?<tracking_url>https://(?:www\.)?(?:myhermes\.de|evri\.com)/[^\s"<>]+)'
      in: [text, html]
  arrival:
    - pattern: '(?<arrival>(?:voraussichtlich|zustellung|kommt|lieferung|expected|arriving|delivery)[^\n]{0,80})'
status_keywords:
  - status: returning
    patterns: ["rücksendung|retoure|returned to sender"]
  - status: at_pickup_point
    patterns:
      [
        "paketshop .{0,40}(?:abholbereit|zur abholung)|abholbereit|ready to collect|parcelshop.{0,40}collect",
      ]
  - status: problem
    patterns: ["nicht angetroffen|zustellversuch|could not deliver|nicht zustellbar"]
  - status: delivered
    patterns: ["wurde zugestellt|successfully delivered|has been delivered"]
  - status: out_for_delivery
    patterns:
      ["kommt heute|wird heute zugestellt|with your local (?:hermes )?courier|out for delivery"]
  - status: in_transit
    patterns: ["ist auf dem weg|unterwegs|on (?:its|the) way"]
require: [tracking_number]
tests:
  - fixture: hermes-de-announced.eml
    time_zone: Europe/Berlin
    expect:
      - ruleId: parcel-hermes
        carrier: hermes
        trackingNumbers: ["H1000012000000101001"]
        status: in_transit
        arrival:
          { from: "2026-11-20T00:00:00+01:00", to: "2026-11-21T00:00:00+01:00", allDay: true }
  - fixture: hermes-de-today.eml
    time_zone: Europe/Berlin
    expect:
      - ruleId: parcel-hermes
        trackingNumbers: ["09123456789013"]
        status: out_for_delivery
        arrival:
          { from: "2026-11-18T10:00:00+01:00", to: "2026-11-18T13:00:00+01:00", allDay: false }
  - fixture: hermes-uk-delivered.eml
    expect:
      - ruleId: parcel-hermes
        trackingNumbers: ["H1000012000000101001"]
        status: delivered
