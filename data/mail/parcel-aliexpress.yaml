# yaml-language-server: $schema=../../schema/mail-rule.schema.json
id: parcel-aliexpress
name: AliExpress parcel updates
kind: parcel
senders:
  addresses: [transaction@notice.aliexpress.com]
carrier: cainiao
extractors: [detect_tracking_numbers]
extract:
  tracking_number:
    - pattern: 'package\s+(?<tracking_number>[A-Z0-9]{10,30}):'
      in: [subject]
  order_number:
    - pattern: '(?:order|bestellung)\s*(?:no\.?|number|nummer)?\s*:?\s*(?<order_number>\d{15,17})\b'
status_keywords:
  - status: delivered
    patterns: ["delivered|zugestellt"]
    in: [subject]
  - status: at_pickup_point
    patterns: ["ready for pickup|ready to collect|abholbereit"]
  - status: out_for_delivery
    patterns: ["out for delivery|in zustellung"]
  - status: problem
    patterns: ["delivery failed|customs (?:hold|issue)|unsuccessful"]
default_status: in_transit
require: [tracking_number]
tests:
  - fixture: aliexpress-shipped.eml
    expect:
      - ruleId: parcel-aliexpress
        carrier: china_post
        trackingNumbers: ["LP000123455CN"]
        orderNumbers: ["8123456789012345"]
        status: in_transit
