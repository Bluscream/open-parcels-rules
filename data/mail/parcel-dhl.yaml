# yaml-language-server: $schema=../../schema/mail-rule.schema.json
id: parcel-dhl
name: DHL parcel notifications
kind: parcel
senders:
  addresses:
    - donotreply_odd@dhl.com
    - noreply.odd@dhl.com
    - pl.no.reply@dhl.com
  domains: [dhl.de]
carrier: dhl
extractors: [detect_tracking_numbers]
extract:
  tracking_url:
    - pattern: '(?<tracking_url>https://(?:www\.|nolp\.)?dhl\.(?:de|com)/[^\s"<>]+)'
      in: [text, html]
  arrival:
    - pattern: '(?<arrival>(?:voraussichtlich|zustellung|kommt|ankunft|scheduled for delivery|arriving|delivery)[^\n]{0,80})'
      in: [subject, text]
status_keywords:
  - status: returning
    patterns: ["zurück an den absender|rücksendung an|returned to (?:the )?sender"]
  - status: at_pickup_point
    patterns:
      [
        "zur abholung bereit|liegt .{0,60}zur abholung|abholbereit|ready for collection|czeka na odbiór",
      ]
  - status: problem
    patterns: ["nicht zugestellt werden|zustellversuch|could not be delivered|delivery attempt"]
  - status: delivered
    patterns: ["wurde zugestellt|zugestellt am|has been delivered|została doręczona"]
  - status: out_for_delivery
    patterns:
      ["kommt heute|wird heute zugestellt|in zustellung|scheduled for delivery today|zostanie dziś"]
  - status: in_transit
    patterns: ["kommt (?:morgen|bald|am)|ist unterwegs|paketankündigung|on its way|w drodze"]
require: [tracking_number]
tests:
  - fixture: dhl-de-announcement.eml
    time_zone: Europe/Berlin
    expect:
      - ruleId: parcel-dhl
        kind: parcel
        carrier: dhl
        trackingNumbers: ["00340434123456789012"]
        orderNumbers: []
        status: in_transit
        arrival:
          { from: "2026-11-19T00:00:00+01:00", to: "2026-11-20T00:00:00+01:00", allDay: true }
        trackingUrl: "https://www.dhl.de/de/privatkunden/pakete-empfangen/verfolgen.html?piececode=00340434123456789012"
  - fixture: dhl-de-today.eml
    time_zone: Europe/Berlin
    expect:
      - ruleId: parcel-dhl
        carrier: dhl
        trackingNumbers: ["340011223348"]
        status: out_for_delivery
        arrival:
          { from: "2026-11-18T14:00:00+01:00", to: "2026-11-18T18:00:00+01:00", allDay: false }
  - fixture: dhl-de-packstation.eml
    time_zone: Europe/Berlin
    expect:
      - ruleId: parcel-dhl
        trackingNumbers: ["JJD0012345678901"]
        status: at_pickup_point
  - fixture: dhl-com-delivered.eml
    expect:
      - ruleId: parcel-dhl
        trackingNumbers: ["LX123123120DE"]
        status: delivered
  - fixture: dhl-pl-delivered.eml
    expect:
      - ruleId: parcel-dhl
        trackingNumbers: ["00340434987654321012"]
        status: delivered
